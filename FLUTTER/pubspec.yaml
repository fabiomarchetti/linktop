name: elderly_monitoring_app
description: App per monitoraggio anziani con GPS, Geofencing e anello Colmi

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # BLE (Bluetooth Low Energy) per Colmi Ring
  flutter_blue_plus: ^1.35.0

  # Backend Supabase
  supabase_flutter: ^2.8.0

  # Background Service (per monitoraggio continuo)
  flutter_foreground_task: ^8.11.0

  # GPS e Localizzazione
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Permessi
  permission_handler: ^11.3.1

  # Storage locale
  shared_preferences: ^2.3.3

  # Batteria
  battery_plus: ^6.2.0

  # Notifiche locali
  flutter_local_notifications: ^18.0.1

  # UI Components
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.2
  intl: ^0.19.0

  # HTTP
  http: ^1.2.0

  # Utilities
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "salute.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "salute.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
